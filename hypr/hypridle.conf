general {
    lock_cmd = pidof hyprlock || hyprlock       # Avoid multiple hyprlock instances
    before_sleep_cmd = loginctl lock-session    # Lock before system sleep
    after_sleep_cmd = hyprctl dispatch dpms on  # Turn screen back on after wake
}

# Lock screen after 5 minutes of inactivity
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Turn off display after 10 minutes
listener {
    timeout = 600
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
