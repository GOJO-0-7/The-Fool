
# ----------------------------------------------------
# Global & Background
# ----------------------------------------------------
general {
    hide_cursor = true
}

background {
    monitor =
    path = /home/antor/.config/hyprlock/wallpapers/20.jpg 
    blur_passes = 2
    blur_size = 6
    color = rgba(10, 10, 10, 0.6) # Darkens the image
}

# ----------------------------------------------------
# Top Left HUD
# ----------------------------------------------------
label {
    monitor =
    text = <span color='##ff3333'>//////</span><br/>SESSION SUSPENDED  //  <span color='##ff3333'>ICE ACTIVE</span><br/>セッション停止 // 防壁稼働中
    font_size = 10
    font_family = JetBrains Mono Nerd Font
    color = rgb(200, 200, 200)
    position = 30, -30
    halign = left
    valign = top
}

# ----------------------------------------------------
# Center Clock (Hours & Minutes)
# ----------------------------------------------------
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    font_size = 110
    font_family = JetBrains Mono ExtraBold
    color = rgb(255, 255, 255)
    position = -20, 120
    halign = center
    valign = center
    shadow_passes = 2
}

# ----------------------------------------------------
# Center Clock (Seconds - Small & Red)
# ----------------------------------------------------
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%S")"
    font_size = 30
    font_family = JetBrains Mono ExtraBold
    color = rgb(255, 50, 50)
    position = 230, 80
    halign = center
    valign = center
}

# ----------------------------------------------------
# Operator & Date Subtext (Below Clock)
# ----------------------------------------------------
label {
    monitor =
    text = cmd[update:1000] echo "OPERATOR <span color='##555555'>//</span> <span color='##ffffff'>GHOST BLADE</span><br/><span color='##aaaaaa'>      $(date +"%m.%d.%y")</span> <span color='##666666'>$(date +"%a" | tr '[:lower:]' '[:upper:]')</span>"
    font_size = 10
    font_size = 10
    font_family = JetBrains Mono Bold
    color = rgb(140, 150, 160)
    position = 0, 15
    halign = center
    valign = center
}

# ----------------------------------------------------
# Center UI Panel (The Box behind the input)
# ----------------------------------------------------
shape {
    monitor =
    size = 550, 180
    color = rgba(0, 0, 0, 0)
    rounding = 5
    border_size = 1
    border_color = rgba(0, 0, 0, 0)
    position = 0, -105
    halign = center
    valign = center
}

# ----------------------------------------------------
# Input Panel Labels
# ----------------------------------------------------
label {
    monitor =
    text = AUTH // PASSPHRASE <span color='##00ffcc'>  コンピューター</span>
    font_size = 9
    font_family = JetBrains Mono, Noto Sans CJK JP
    color = rgb(200, 200, 200)
    position = -130, -40
    halign = center
    valign = center
}


# ----------------------------------------------------
# Input Field
# ----------------------------------------------------
input-field {
    monitor =
    size = 400, 50
    outline_thickness = 1
    dots_size = 0.2
    dots_spacing = 2
    dots_center = true
    dots_rounding = 0 # Makes the password dots square/rectangular
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(0, 0, 0, 0.0)
    font_color = rgb(200, 200, 200)
    fade_on_empty = true
    placeholder_text = 
    hide_input = false
    position = 0, -105
    halign = center
    valign = center
}

# ----------------------------------------------------
# Power Profile + Battery Status
# ----------------------------------------------------
label {
    monitor =
    text = cmd[update:3000] ~/.config/hypr/scripts/power.sh
    font_size = 10
    font_family = JetBrains Mono Bold
    color = rgb(140, 150, 160)
    
    position = -30, 30
    halign = right
    valign = bottom
}

# ----------------------------------------------------
# Playing Track Name Only
# ----------------------------------------------------
label {
    monitor =
    text = cmd[update:1000] ~/.config/hypr/scripts/media.sh
    font_size = 10
    font_family = JetBrains Mono Bold, Noto Sans CJK JP
    color = rgb(200, 200, 200)
    
    position = 0, 70
    halign = center
    valign = bottom
}

# ----------------------------------------------------
# Wi-Fi SSID Status (Bottom Left)
# ----------------------------------------------------
label {
    monitor =
    text = cmd[update:5000] ~/.config/hypr/scripts/wifi.sh
    font_size = 10
    font_family = JetBrains Mono Bold, Nerd Font
    color = rgb(140, 150, 160)
    
    position = 30, 30
    halign = left
    valign = bottom
}

# ----------------------------------------------------
# Detailed Weather HUD (Top Right)
# ----------------------------------------------------
label {
    monitor =
    text = cmd[update:1800000] bash -c "$HOME/.config/hypr/scripts/weather.sh"
    font_size = 10
    font_family = JetBrains Mono Bold, Nerd Font
    color = rgb(140, 150, 160)

    position = -30, -30
    halign = right
    valign = top
}
