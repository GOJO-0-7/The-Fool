# ==============================================================================
# KITTY CONFIGURATION (MERGED + TOKYO NIGHT THEME)
# ==============================================================================

# ---------- Font & Typography ----------
font_family      CaskaydiaCove Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        10.0

disable_ligatures cursor

modify_font cell_height 100%
modify_font baseline 0
modify_font underline_position 2
modify_font underline_thickness 150%
undercurl_style thin-sparse

# Symbol mapping for Nerd Fonts
symbol_map U+e0a0-U+e0a2,U+e0b0-U+e0b3 CaskaydiaCove Nerd Font Mono
symbol_map U+e0a3,U+e0b4-U+e0c8,U+e0ca,U+e0cc-U+e0d4 CaskaydiaCove Nerd Font Mono
symbol_map U+23fb-U+23fe,U+2b58 CaskaydiaCove Nerd Font Mono
symbol_map U+f000-U+f2e0 CaskaydiaCove Nerd Font Mono
symbol_map U+e5fa-U+e6b2 CaskaydiaCove Nerd Font Mono
symbol_map U+e700-U+e7c5 CaskaydiaCove Nerd Font Mono
symbol_map U+f300-U+f372 CaskaydiaCove Nerd Font Mono
symbol_map U+e200-U+e2a9 CaskaydiaCove Nerd Font Mono
symbol_map U+f400-U+f532 CaskaydiaCove Nerd Font Mono
symbol_map U+ea88-U+eadc CaskaydiaCove Nerd Font Mono

# ---------- Window ----------
initial_window_width   120c
initial_window_height  35c
remember_window_size   yes
background_opacity     0.7
window_padding_width   16
active_border_color    #7aa2f7
inactive_border_color  #3b4261

# ---------- Tabs ----------
tab_bar_style          powerline
tab_powerline_style    slanted
tab_bar_edge           top

# ---------- Cursor ----------
cursor_shape           underline
cursor_blink_interval  0.5
cursor_trail           3
shell_integration      no-cursor

# ---------- Performance ----------
sync_to_monitor        yes
repaint_delay          10

# ---------- Clipboard & Mouse ----------
copy_on_select         yes
mouse_map right press ungrabbed paste_from_clipboard

# ---------- Hyperlinks & Graphics ----------
allow_hyperlinks       yes
detect_urls            yes
underline_hyperlinks   hover

# ---------- Sound & Scrollback ----------
enable_audio_bell      no
visual_bell_duration   0
scrollback_lines       100000

# ==============================================================================
# TOKYO NIGHT COLOR SCHEME
# ==============================================================================
foreground             #c0caf5
background             #1a1b26
selection_foreground   #c0caf5
selection_background   #28344a

# Cursor colors
cursor                 #c0caf5
cursor_text_color      #1a1b26

# URL underline color
url_color              #73daca

# Tab bar colors
active_tab_foreground   #1f2335
active_tab_background   #7aa2f7
inactive_tab_foreground #545c7e
inactive_tab_background #292e42
tab_bar_background      #16161e

# Standard 16 Terminal Colors
# Black
color0 #15161e
color8 #414868

# Red
color1 #f7768e
color9 #f7768e

# Green
color2  #9ece6a
color10 #9ece6a

# Yellow
color3  #e0af68
color11 #e0af68

# Blue
color4  #7aa2f7
color12 #7aa2f7

# Magenta
color5  #bb9af7
color13 #bb9af7

# Cyan
color6  #7dcfff
color14 #7dcfff

# White
color7  #a9b1d6
color15 #c0caf5
